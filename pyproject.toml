[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: fast unit tests (no providers)",
    "integration: requires live providers and API keys",
    "regression: full pipeline tests against server",
    "soak: long-running (30min+)",
    "manual: requires human interaction",
    "local: requires local macOS display (auto-skipped on headless CI)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 200
extend-ignore = ["E402", "E731", "E741", "F841"]
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I"]

[tool.ruff.format]
quote-style = "double"
