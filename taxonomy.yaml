# ─── Soft Spots to Revisit Post-Training ───
soft_spots:
  - merge: ocr_document → image_analyze
    reason: "OCR (extract text) vs image_analyze (visual description) may need distinct handling"
    check: "eval accuracy on image_analyze; confusion between OCR-style and description-style queries"
  - merge: open_in_finder → file_list
    reason: "list files (show in chat) vs open in Finder (launch app) are different actions"
    check: "eval accuracy on file_list; user phrasing 'open in finder' vs 'list files'"
